<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Nova Weather — Live forecasts & smart suggestions</title>
    <meta
      name="description"
      content="Nova Weather is a beautiful live weather app: real-time forecasts and 7-day outlooks for any city, with a whole page that changes colour with the sky — golden for sun, blue for rain, grey for clouds."
    />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://nova-weather.vercel.app/" />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook / LinkedIn / iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nova Weather" />
    <meta property="og:title" content="Nova Weather — Live forecasts & smart suggestions" />
    <meta
      property="og:description"
      content="Real-time weather for any city. The whole page changes colour with the sky: golden for sun, blue for rain, grey for clouds."
    />
    <meta property="og:url" content="https://nova-weather.vercel.app/" />
    <meta property="og:image" content="https://nova-weather.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nova Weather — live forecasts with a page that changes colour with the sky" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nova Weather — Live forecasts & smart suggestions" />
    <meta
      name="twitter:description"
      content="Real-time weather for any city. The whole page changes colour with the sky: golden for sun, blue for rain, grey for clouds."
    />
    <meta name="twitter:image" content="https://nova-weather.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Nova Weather — live forecasts with a page that changes colour with the sky" />

    <!-- Fonts (Plus Jakarta Sans, used across the app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
